<body>
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #050505, #000);
            color: #fff;
            font-family: 'Georgia', serif;
            overflow-x: hidden;
        }

        .observatory-container {
            text-align: center;
            padding: 120px 20px;
            position: relative;
        }

        /* Floating star particles */
        .star {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #ffd700;
            border-radius: 50%;
            opacity: 0.8;
            animation: twinkle 4s infinite ease-in-out;
        }

        @keyframes twinkle {
            0% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.4); }
            100% { opacity: 0.4; transform: scale(1); }
        }

        /* Glowing header */
        .observatory-title {
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 0 0 25px #ffd700;
        }

        .observatory-subtitle {
            font-size: 22px;
            max-width: 700px;
            margin: 0 auto 40px;
            opacity: 0.9;
        }

        /* Orb icon */
        .observatory-icon {
            width: 170px;
            height: 170px;
            background-image: url('icons/orb-gold.svg');
            background-size: contain;
            background-repeat: no-repeat;
            margin: 40px auto;
            filter: drop-shadow(0 0 25px #ffd700);
            animation: orbRotate 6s linear infinite;
        }

        @keyframes orbRotate {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        /* Back button */
        .back-button {
            display: inline-block;
            margin-top: 40px;
            padding: 12px 22px;
            background: #ffd700;
            color: #000;
            font-weight: bold;
            border-radius: 8px;
            text-decoration: none;
            transition: background

            <script>
    const ambient = document.getElementById('ambientSound');
    ambient.volume = 0;

    ambient.play().then(() => {
        let vol = 0;
        const fade = setInterval(() => {
            vol += 0.02;
            ambient.volume = vol;
            if (vol >= 0.4) clearInterval(fade);
        }, 150);
    });
</script>
<script>
    const portalActivate = document.getElementById('portalActivate');

    document.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', () => {
            portalActivate.currentTime = 0;
            portalActivate.play();
        });
    });
</script>
<script>
    document.querySelectorAll('.portal-item, .realm-nav a, .map-node').forEach(icon => {
        icon.addEventListener('mousemove', (e) => {
            const trail = document.createElement('div');
            trail.classList.add('icon-trail');
            document.body.appendChild(trail);

            trail.style.left = e.pageX + 'px';
            trail.style.top = e.pageY + 'px';

            setTimeout(() => {
                trail.remove();
            }, 600);
        });
    });
</script>
<script>
    document.querySelectorAll('.portal-item').forEach(portal => {
        portal.addEventListener('click', () => {
            portal.classList.add('portal-click-animate');

            setTimeout(() => {
                portal.classList.remove('portal-click-animate');
            }, 450);
        });
    });
</script>
<script>
    const particleContainer = document.querySelector('.realm-particles');

    for (let i = 0; i < 25; i++) {
        const p = document.createElement('span');
        p.style.left = Math.random() * 100 + '%';
        p.style.top = Math.random() * 100 + '%';
        p.style.animationDelay = (Math.random() * 4) + 's';
        particleContainer.appendChild(p);
    }
</script>
<script>
    window.addEventListener('DOMContentLoaded', () => {
        const container = document.querySelector('.realm-container, .library-container, .guidance-container, .unity-container, .observatory-container, .belonging-container');

        for (let i = 0; i < 20; i++) {
            const burst = document.createElement('div');
            burst.classList.add('realm-burst');

            burst.style.left = (Math.random() * 100) + '%';
            burst.style.top = (Math.random() * 100) + '%';
            burst.style.animationDelay = (Math.random() * 0.4) + 's';

            container.appendChild(burst);

            setTimeout(() => burst.remove(), 1500);
        }
    });
</script>
