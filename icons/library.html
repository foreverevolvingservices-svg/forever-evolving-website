<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Library of Becoming</title>
    <link rel="stylesheet" href="css/main.css">

    <style>
        <body>
<div class="cosmic-parallax">
    <div class="parallax-layer stars"></div>
    <div class="parallax-layer nebula"></div>
</div>

            <div class="transition-overlay"></div>

<audio id="ambientSound" src="sounds/library-ambience.mp3" preload="auto" loop></audio>
<audio id="arrivalLibrary" src="sounds/library-arrival.mp3" preload="auto"></audio>

<audio id="portalActivate" src="sounds/portal-activate.mp3" preload="auto"></audio>


    <nav class="realm-nav">
        <a href="index.html">Home</a>
        <a href="library.html">Library</a>
        <a href="guidance.html">Guidance</a>
        <a href="unity.html">Unity</a>
        <a href="observatory.html">Observatory</a>
        <a href="belonging.html">Belonging</a>
    </nav>
<div class="evolving-gate">
    <img src="icons/evolving-gate.svg" alt="Evolving Gate">
</div>

    <div class="library-container">
        <div class="realm-particles"></div>

        <div class="library-title">The Library of Becoming</div>

        <div class="library-subtitle">
            A sanctuary of wisdom, reflection, and growth.  
            Where every page opens a doorway into deeper understanding.
        </div>

        <div class="library-icon"></div>
    </div>


    <footer class="realm-footer">
    <a href="index.html">← Return to the Realm Gate</a>
</footer>

</body>


            
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #1a1a1a, #000);
            color: #fff;
            font-family: 'Georgia', serif;
            overflow-x: hidden;
        }

        .library-container {
            text-align: center;
            padding: 120px 20px;
            position: relative;
        }

        /* Floating particles */
        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #ffd700;
            border-radius: 50%;
            opacity: 0.7;
            animation: floatUp 6s infinite ease-in-out;
        }

        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 0.7; }
            50% { opacity: 1; }
            100% { transform: translateY(-120px); opacity: 0; }
        }

        /* Glowing header */
        .library-title {
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #ffd700;
        }

        .library-subtitle {
            font-size: 22px;
            max-width: 700px;
            margin: 0 auto 40px;
            opacity: 0.9;
        }

        /* Glowing book icon */
        .library-icon {
            width: 140px;
            height: 140px;
            background-image: url('icons/book-gold.svg');
            background-size: contain;
            background-repeat: no-repeat;
            margin: 40px auto;
            filter: drop-shadow(0 0 20px #ffd700);
            animation: pulseGlow 3s infinite ease-in-out;
        }

        @keyframes pulseGlow {
            0% { filter: drop-shadow(0 0 12px #ffd700); }
            50% { filter: drop-shadow(0 0 28px #ffea8a); }
            100% { filter: drop-shadow(0 0 12px #ffd700); }
        }

        /* Back button */
        .back-button {
            display: inline-block;
            margin-top: 40px;
            padding: 12px 22px;
            background: #ffd700;
            color: #000;
            font-weight: bold;
            border-radius: 8px;
            text-decoration: none;
            transition: background 0.3s ease;
        }

        .back-button:hover {
            background: #fff3a0;
        }
    </style>
</head>

<body>

  <script>
    const ambient = document.getElementById('ambientSound');
    ambient.volume = 0;

    ambient.play().then(() => {
        let vol = 0;
        const fade = setInterval(() => {
            vol += 0.02;
            ambient.volume = vol;
            if (vol >= 0.4) clearInterval(fade);
        }, 150);
    });
</script>
 <script>
    const portalActivate = document.getElementById('portalActivate');

    document.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', () => {
            portalActivate.currentTime = 0;
            portalActivate.play();
        });
    });
</script>
<script>
    document.querySelectorAll('.portal-item, .realm-nav a, .map-node').forEach(icon => {
        icon.addEventListener('mousemove', (e) => {
            const trail = document.createElement('div');
            trail.classList.add('icon-trail');
            document.body.appendChild(trail);

            trail.style.left = e.pageX + 'px';
            trail.style.top = e.pageY + 'px';

            setTimeout(() => {
                trail.remove();
            }, 600);
        });
    });
</script>
<script>
    document.querySelectorAll('.portal-item').forEach(portal => {
        portal.addEventListener('click', () => {
            portal.classList.add('portal-click-animate');

            setTimeout(() => {
                portal.classList.remove('portal-click-animate');
            }, 450);
        });
    });
</script>

<script>
    const particleContainer = document.querySelector('.realm-particles');

    for (let i = 0; i < 25; i++) {
        const p = document.createElement('span');
        p.style.left = Math.random() * 100 + '%';
        p.style.top = Math.random() * 100 + '%';
        p.style.animationDelay = (Math.random() * 4) + 's';
        particleContainer.appendChild(p);
    }
</script>

<script>
    window.addEventListener('DOMContentLoaded', () => {
        const container = document.querySelector('.realm-container, .library-container, .guidance-container, .unity-container, .observatory-container, .belonging-container');

        for (let i = 0; i < 20; i++) {
            const burst = document.createElement('div');
            burst.classList.add('realm-burst');

            burst.style.left = (Math.random() * 100) + '%';
            burst.style.top = (Math.random() * 100) + '%';
            burst.style.animationDelay = (Math.random() * 0.4) + 's';

            container.appendChild(burst);

            setTimeout(() => burst.remove(), 1500);
        }
    });
</script>
<script>
    const realmContainer =
        document.querySelector('.library-container, .guidance-container, .unity-container, .observatory-container, .belonging-container');

    document.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', (e) => {
            // Only animate when leaving the realm (not internal anchors)
            if (!link.href.includes('#')) {
                e.preventDefault();

                realmContainer.classList.add('realm-exit');

                setTimeout(() => {
                    window.location = link.href;
                }, 900); // matches animation duration
            }
        });
    });
</script>
<script>
    window.addEventListener('DOMContentLoaded', () => {
        const audio =
            document.getElementById('arrivalLibrary') ||
            document.getElementById('arrivalGuidance') ||
            document.getElementById('arrivalUnity') ||
            document.getElementById('arrivalObservatory') ||
            document.getElementById('arrivalBelonging');

        if (audio) {
            audio.currentTime = 0;
            audio.play();
        }
    });
</script>
