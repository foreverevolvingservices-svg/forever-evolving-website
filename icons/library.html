            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #1a1a1a, #000);
            color: #fff;
            font-family: 'Georgia', serif;
            overflow-x: hidden;
        }

        .library-container {
            text-align: center;
            padding: 120px 20px;
            position: relative;
        }

        /* Floating particles */
        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #ffd700;
            border-radius: 50%;
            opacity: 0.7;
            animation: floatUp 6s infinite ease-in-out;
        }

        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 0.7; }
            50% { opacity: 1; }
            100% { transform: translateY(-120px); opacity: 0; }
        }

        /* Glowing header */
        .library-title {
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #ffd700;
        }

        .library-subtitle {
            font-size: 22px;
            max-width: 700px;
            margin: 0 auto 40px;
            opacity: 0.9;
        }

        /* Glowing book icon */
        .library-icon {
            width: 140px;
            height: 140px;
            background-image: url('icons/book-gold.svg');
            background-size: contain;
            background-repeat: no-repeat;
            margin: 40px auto;
            filter: drop-shadow(0 0 20px #ffd700);
            animation: pulseGlow 3s infinite ease-in-out;
        }

        @keyframes pulseGlow {
            0% { filter: drop-shadow(0 0 12px #ffd700); }
            50% { filter: drop-shadow(0 0 28px #ffea8a); }
            100% { filter: drop-shadow(0 0 12px #ffd700); }
        }

        /* Back button */
        .back-button {
            display: inline-block;
            margin-top: 40px;
            padding: 12px 22px;
            background: #ffd700;
            color: #000;
            font-weight: bold;
            border-radius: 8px;
            text-decoration: none;
            transition: background 0.3s ease;
        }

        .back-button:hover {
            background: #fff3a0;
        }
    </style>
</head>

<body>

  <script>
    const ambient = document.getElementById('ambientSound');
    ambient.volume = 0;

    ambient.play().then(() => {
        let vol = 0;
        const fade = setInterval(() => {
            vol += 0.02;
            ambient.volume = vol;
            if (vol >= 0.4) clearInterval(fade);
        }, 150);
    });
</script>
