        {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #0a0a0a, #000);
            color: #fff;
            font-family: 'Georgia', serif;
            overflow-x: hidden;
        }

        .unity-container {
            text-align: center;
            padding: 120px 20px;
            position: relative;
        }

        /* Floating heart particles */
        .heart {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #ffd700;
            transform: rotate(45deg);
            opacity: 0.7;
            animation: rise 6s infinite ease-in-out;
        }

        .heart::before,
        .heart::after {
            content: "";
            position: absolute;
            width: 10px;
            height: 10px;
            background: #ffd700;
            border-radius: 50%;
        }

        .heart::before {
            top: -5px;
            left: 0;
        }

        .heart::after {
            left: 5px;
            top: 0;
        }

        @keyframes rise {
            0% { transform: translateY(0) rotate(45deg); opacity: 0.7; }
            50% { opacity: 1; }
            100% { transform: translateY(-120px) rotate(45deg); opacity: 0; }
        }

        /* Glowing header */
        .unity-title {
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 0 0 22px #ffd700;
        }

        .unity-subtitle {
            font-size: 22px;
            max-width: 700px;
            margin: 0 auto 40px;
            opacity: 0.9;
        }

        /* Hands icon */
        .unity-icon {
            width: 160px;
            height: 160px;
            background-image: url('icons/hands-gold.svg');
            background-size: contain;
            background-repeat: no-repeat;
            margin: 40px auto;
            filter: drop-shadow

   <script>
    const ambient = document.getElementById('ambientSound');
    ambient.volume = 0;

    ambient.play().then(() => {
        let vol = 0;
        const fade = setInterval(() => {
            vol += 0.02;
            ambient.volume = vol;
            if (vol >= 0.4) clearInterval(fade);
        }, 150);
    });
</script>
   <script>
    const portalActivate = document.getElementById('portalActivate');

    document.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', () => {
            portalActivate.currentTime = 0;
            portalActivate.play();
        });
    });
</script>
      <script>
    document.querySelectorAll('.portal-item, .realm-nav a, .map-node').forEach(icon => {
        icon.addEventListener('mousemove', (e) => {
            const trail = document.createElement('div');
            trail.classList.add('icon-trail');
            document.body.appendChild(trail);

            trail.style.left = e.pageX + 'px';
            trail.style.top = e.pageY + 'px';

            setTimeout(() => {
                trail.remove();
            }, 600);
        });
    });
</script>
<script>
    document.querySelectorAll('.portal-item').forEach(portal => {
        portal.addEventListener('click', () => {
            portal.classList.add('portal-click-animate');

            setTimeout(() => {
                portal.classList.remove('portal-click-animate');
            }, 450);
        });
    });
</script>
<script>
    const particleContainer = document.querySelector('.realm-particles');

    for (let i = 0; i < 25; i++) {
        const p = document.createElement('span');
        p.style.left = Math.random() * 100 + '%';
        p.style.top = Math.random() * 100 + '%';
        p.style.animationDelay = (Math.random() * 4) + 's';
        particleContainer.appendChild(p);
    }
</script>
<script>
    window.addEventListener('DOMContentLoaded', () => {
        const container = document.querySelector('.realm-container, .library-container, .guidance-container, .unity-container, .observatory-container, .belonging-container');

        for (let i = 0; i < 20; i++) {
            const burst = document.createElement('div');
            burst.classList.add('realm-burst');

            burst.style.left = (Math.random() * 100) + '%';
            burst.style.top = (Math.random() * 100) + '%';
            burst.style.animationDelay = (Math.random() * 0.4) + 's';

            container.appendChild(burst);

            setTimeout(() => burst.remove(), 1500);
        }
    });
</script>
