<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Belonging ∞ Forever Evolving</title>

  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/realms.css">

  <!-- Belonging-specific animations -->
  <style>
    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at center, #0b0b0b, #0b0b0b);
      color: #fff;
      font-family: 'Georgia', serif;
      overflow-x: hidden;
    }

    .belonging-container {
      text-align: center;
      padding: 120px 20px;
      position: relative;
    }

    .belonging-title {
      font-size: 48px;
      margin-bottom: 20px;
      text-shadow: 0 0 25px #ffd700;
    }

    .belonging-subtitle {
      font-size: 22px;
      max-width: 700px;
      margin: 0 auto 40px;
      opacity: 0.9;
    }

    .belonging-icon {
      width: 170px;
      height: 170px;
      background-image: url('icons/key-gold.svg');
      background-size: contain;
      background-repeat: no-repeat;
      margin: 40px auto;
      filter: drop-shadow(0 0 25px #ffd700);
      animation: keyGlow 3s infinite ease-in-out;
    }

    @keyframes keyGlow {
      0% { transform: scale(1); filter: drop-shadow(0 0 15px #ffd700); }
      50% { transform: scale(1.05); filter: drop-shadow(0 0 30px #ffd700); }
      100% { transform: scale(1); filter: drop-shadow(0 0 15px #ffd700); }
    }

    .wing {
      position: absolute;
      width: 14px;
      height: 14px;
      background: #ffd700;
      clip-path: polygon(0% 50%, 50% 0%, 100% 50%, 50% 100%);
      opacity: 0.7;
      animation: flutter 5s infinite ease-in-out;
    }

    @keyframes flutter {
      0% { transform: translateY(0px) rotate(0deg); opacity: 1; }
      50% { transform: translateY(-80px) rotate(10deg); opacity: 0.8; }
      100% { transform: translateY(-160px) rotate(0deg); opacity: 1; }
    }
  </style>
</head>

<body>

  <!-- Cosmic Parallax -->
  <div class="cosmic-parallax">
    <div class="parallax-layer stars"></div>
    <div class="parallax-layer nebula"></div>
  </div>

  <!-- Cosmic Transition -->
  <div class="cosmic-transition"></div>
